[versions]
agp = "9.3.1"
ksp = "2.3.11"
appcompat = "1.1.0"
coreKtx = "1.1.0"
junit = "4.13.2"
androidxTestRunner = "1.6.2"
espresso = "3.6.1"
ktlint = "0.36.0"
room = "2.7.1"
retrofit = "2.6.1"
